[project]
name = "project-b"
version = "0.1.0"
description = "代码理解考核 Agent：AI 当考官，以代码为证据检验一个人对代码的理解"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers[postgres,redis]>=4.13.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501", "B008", "SIM108", "ASYNC109", "ASYNC230", "ASYNC240", "SIM105"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
# 只检查核心目录（SPEC 14）；它们导入的其他模块静默跟随，不在这里报错
follow_imports = "silent"
files = ["app/core", "app/agents", "app/tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning"]
